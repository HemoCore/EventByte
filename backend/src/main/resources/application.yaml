spring:
  application:
    name: eventbyte
  datasource:
    url: jdbc:postgresql://localhost:5432/eventbyte
    username: root
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eventbyte

eventbyte:
  booking:
    # US-14: an unpaid booking expires this long after it was made, and its seats go back on sale
    expiration: 15m
    # how often the expiration job runs
    expiration-check: 30s

# US-16: Stripe secret test key (sk_test_...), given by the STRIPE_SECRET_KEY environment variable.
# Empty = the app still starts, but bookings stay "reserved" (no payment) and expire after the delay.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  # US-17: signing secret of the webhook (whsec_..., given by "stripe listen" or the Stripe dashboard).
  # Empty = the app still starts, but every webhook is refused (400) and bookings stay "awaiting-payment".
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

