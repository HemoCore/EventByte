spring:
  application:
    name: eventbyte
  datasource:
    url: jdbc:postgresql://localhost:5432/eventbyte
    username: root
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        default-requeue-rejected: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eventbyte

eventbyte:
  booking:
    # US-14: an unpaid booking expires this long after it was made, and its seats go back on sale
    expiration: 15m
    # how often the expiration job runs
    expiration-check: 30s

