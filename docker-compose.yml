services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: 
      - start-dev 
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./docker/eventbyte.json:/opt/keycloak/data/import/eventbyte.json
      - ./docker/themes:/opt/keycloak/providers/
    depends_on:
      - keycloak-db

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: eventbyte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql

  strapi:
    build: ./frontend/strapi
    env_file:
      - ./frontend/strapi/.env
    ports:
      - "1337:1337"
    depends_on:
      - postgres
      - rabbitmq

  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY: Cd9_wZ5drjqixClHEnbof-4h0bgktUzXwaY3yt8wJoM
      MEILI_ENV: production
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  web:
    build: ./frontend/web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/web/.env:/app/.env
    command: pnpm dev --host

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventbyte
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/eventbyte/protocol/openid-connect/certs
      MEILISEARCH_HOST: http://meilisearch:7700
      # US-16: taken from the shell, e.g. PowerShell: $env:STRIPE_SECRET_KEY="sk_test_..." (empty = no payment)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # US-17: webhook signing secret (whsec_...), e.g. from "stripe listen" (empty = webhooks refused)
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - keycloak
      - meilisearch
    restart: on-failure

volumes:
  keycloak_postgres_data:
  postgres_data:
  meilisearch_data:
  rabbitmq-data:
  redis_data:
